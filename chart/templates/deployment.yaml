apiVersion: apps/v1
kind: Deployment
metadata:
  name: '{{ .Release.Name }}'
  labels:
    app.kubernetes.io/name: '{{ .Chart.Name }}'
    app.kubernetes.io/instance: '{{ .Release.Name }}'
    app.kubernetes.io/version: '{{ .Chart.Version }}'
    app.kubernetes.io/component: map
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: map
      app.kubernetes.io/instance: '{{ .Release.Name }}'
  template:
    metadata:
      labels:
        app.kubernetes.io/component: map
        app.kubernetes.io/instance: '{{ .Release.Name }}'
    spec:
      containers:
        - name: map
          image: '{{ .Values.repository.image }}:{{ .Values.repository.tag }}'
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "8080"
            - name: MBTILES_DIR
              value: /mbtiles
            - name: PUBLIC_BASE_URL
              value: 'https://{{ .Values.hostname }}'
          volumeMounts:
            - mountPath: /mbtiles
              name: mbtiles
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: mbtiles
          hostPath:
            path: {{ .Values.mbtilesDir }}
            type: Directory
